name: Deploy to AWS

# Keep production deployment deliberate. Validation still runs on every pull
# request through the normal CI workflow.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fantasy-copilot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: docker/setup-qemu-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci

      - name: Check infrastructure
        working-directory: infra
        run: npm run build

      - name: Deploy stack and content-addressed image
        working-directory: infra
        env:
          DOMAIN_NAME: ${{ vars.AWS_DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.AWS_HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.AWS_HOSTED_ZONE_NAME }}
        run: |
          args=(FantasyCopilot --require-approval never -c environment=production)
          if [[ -n "$DOMAIN_NAME" ]]; then args+=(-c "domainName=$DOMAIN_NAME"); fi
          if [[ -n "$HOSTED_ZONE_ID" ]]; then args+=(-c "hostedZoneId=$HOSTED_ZONE_ID"); fi
          if [[ -n "$HOSTED_ZONE_NAME" ]]; then args+=(-c "hostedZoneName=$HOSTED_ZONE_NAME"); fi
          npx cdk deploy "${args[@]}"
